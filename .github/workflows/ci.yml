# Forge Atlas Wave 1 H13: minimal CI. Install + existing checks only. No secrets, no deploy (Release Watch owns deploys).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        continue-on-error: true  # fails on a fresh install: routeTree.gen.ts is generated by vite build; make required once generated in CI
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
